; PHP runtime tuning untuk modul BMN/Aset bulk action.
; File ini auto-load oleh PHP-FPM/CGI per direktori (PHP_INI_USER + PHP_INI_PERDIR).
; Hosting Apache mod_php memakai .htaccess (lihat blok php_value di bawah).
;
; Kenapa dibutuhkan:
; - Halaman index mendukung up to 1000 row per page (1000 checkbox + hidden inputs).
;   Default max_input_vars (1000) akan memotong sebagian checkbox -> ID hilang.
; - Bulk delete maksimal 5000 ID per submit (di-enforce server-side di controller).
; - Import Excel dapat berukuran hingga ~10MB.

max_input_vars = 10000
post_max_size = 32M
upload_max_filesize = 16M
max_input_time = 120
max_execution_time = 120
memory_limit = 256M
